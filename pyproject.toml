[project]
name = "vSTMD"
version = "0.0.1"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.6",
    "opencv-python>=4.12.0.88",
    "scipy>=1.16.1",
    "torch>=2.7.0",
    "torchvision>=0.22.0",
    "tqdm",
    "ptlflow",
    "prettytable",
]


[tool.uv.sources]
torch = [
  { index = "pytorch-cu126" },
]
torchvision = [
  { index = "pytorch-cu126" },
]


[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true


[dependency-groups]
dev = []



